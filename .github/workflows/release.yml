# Builds Cleany for macOS, Windows and Linux and attaches the installers to a
# draft GitHub Release (ADR-0008). Publishing the draft is a manual step.
# The release notes come from the matching "## [x.y.z]" section of CHANGELOG.md
# (ADR-0009). The run stops if that section is missing.
#
# Trigger: push a tag that matches src-tauri/tauri.conf.json "version", e.g.
#   git tag v0.1.0 && git push origin v0.1.0
# or run it from the Actions tab with an existing tag.
#
# macOS is signed and notarized (the app and the disk image around it) when
# these repository secrets are set:
#   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  password of that .p12
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: <name> (<team id>)"
#   APPLE_ID                    Apple ID used for notarization
#   APPLE_PASSWORD              app-specific password for that Apple ID
#   APPLE_TEAM_ID               team id
# Windows and Linux builds are unsigned.
#
# Automatic updates (ADR-0011) need the updater signing key as secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of the key from `tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
# With them, each build also signs its update bundle and the last job publishes
# latest.json, which installed copies read through
# releases/latest/download/latest.json once the draft is published. Its public
# key is plugins.updater.pubkey in src-tauri/tauri.conf.json.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag matches the app version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match tauri.conf.json version $version"
            exit 1
          fi
      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v v="${TAG#v}" '
            index($0, "## [" v "]") == 1 { f = 1; next }
            /^## \[/ || /^\[[^]]+\]: / { f = 0 }
            f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no notes for ${TAG#v}. Add a \"## [${TAG#v}]\" section first."
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the draft release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --verify-tag \
              --title "Cleany ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            bundle: target/universal-apple-darwin/release/bundle
          - name: Windows
            os: windows-latest
            args: ''
            bundle: target/release/bundle
          - name: Linux
            os: ubuntu-22.04
            args: ''
            bundle: target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - name: Build the bundles
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # An empty variable would make the Tauri CLI try to sign with nothing.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::warning::Apple secrets are not set, the macOS build is not signed or notarized"
          fi
          updater=()
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            updater=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          else
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            echo "::warning::Updater signing key is not set, this release offers no automatic update"
          fi
          pnpm --dir ui tauri build ${{ matrix.args }} "${updater[@]}"
      # Tauri notarizes Cleany.app but not the disk image around it, and
      # Gatekeeper rejects a signed disk image that is not notarized.
      - name: Notarize the disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::warning::Apple secrets are not set, the disk image is not notarized"
            exit 0
          fi
          shopt -s nullglob
          for dmg in "${{ matrix.bundle }}"/dmg/*.dmg; do
            xcrun notarytool submit "$dmg" --wait \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
            xcrun stapler staple "$dmg"
            spctl -a -vv -t open --context context:primary-signature "$dmg"
          done
      - name: Upload to the draft release
        shell: bash
        run: |
          shopt -s nullglob
          dir="${{ matrix.bundle }}"
          files=("$dir"/dmg/*.dmg "$dir"/nsis/*.exe "$dir"/msi/*.msi "$dir"/appimage/*.AppImage "$dir"/deb/*.deb "$dir"/rpm/*.rpm)
          # Update bundles and their signatures, when the signing key is set.
          files+=("$dir"/macos/*.app.tar.gz "$dir"/*/*.sig)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installers found under $dir"
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

  updater:
    name: Publish latest.json
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Write latest.json from the signatures
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sigs" && cd "$RUNNER_TEMP/sigs"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' || true
          shopt -s nullglob
          sigs=(*.sig)
          if [ ${#sigs[@]} -eq 0 ]; then
            echo "::warning::No update signatures in $TAG, latest.json is not published"
            exit 0
          fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          platforms='{}'
          add() { # add <key> <asset>
            platforms=$(jq --arg k "$1" --arg u "$base/$2" --rawfile s "$2.sig" \
              '. + {($k): {url: $u, signature: ($s | rtrimstr("\n"))}}' <<<"$platforms")
          }
          for sig in "${sigs[@]}"; do
            asset="${sig%.sig}"
            case "$asset" in
              *.app.tar.gz)
                for k in darwin-aarch64 darwin-x86_64 darwin-aarch64-app darwin-x86_64-app; do add "$k" "$asset"; done ;;
              *-setup.exe) add windows-x86_64 "$asset"; add windows-x86_64-nsis "$asset" ;;
              *.msi) add windows-x86_64-msi "$asset" ;;
              *.AppImage) add linux-x86_64 "$asset"; add linux-x86_64-appimage "$asset" ;;
              *.deb) add linux-x86_64-deb "$asset" ;;
              *.rpm) add linux-x86_64-rpm "$asset" ;;
              *) echo "::warning::Unknown signed asset $asset" ;;
            esac
          done
          jq -n --arg v "${TAG#v}" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson p "$platforms" \
            '{version: $v, pub_date: $d, platforms: $p}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
